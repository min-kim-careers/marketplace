name: market_prod
services:
  # ----------------------------------- API -----------------------------------
  market_prod_api-db-service:
    extends:
      file: ./api/compose.prod.yml
      service: market_prod_api-db-service
    networks:
      - market_prod_api-network

  market_prod_api-cache-service:
    extends:
      file: ./api/compose.prod.yml
      service: market_prod_api-cache-service
    networks:
      - market_prod_api-network

  market_prod_api-service:
    extends:
      file: ./api/compose.prod.yml
      service: market_prod_api-service
    depends_on:
      market_prod_api-db-service:
        condition: service_healthy
      market_prod_api-cache-service:
        condition: service_started
    networks:
      - market_prod_gateway-network
      - market_prod_api-network

  # ----------------------------------- WEB -----------------------------------
  market_prod_web-service:
    extends:
      file: ./web/compose.prod.yml
      service: market_prod_web-service
    networks:
      - market_prod_gateway-network

  # ----------------------------------- GATEWAY -----------------------------------
  market_prod_gateway-service:
    extends:
      file: ./gateway/compose.prod.yml
      service: market_prod_gateway-service
    networks:
      - market_prod_tunnel-network
      - market_prod_gateway-network
    depends_on:
      - market_prod_api-service
      - market_prod_web-service

  # ----------------------------------- TUNNEL -----------------------------------
  market_prod_tunnel-service:
    extends:
      file: ./tunnel/compose.prod.yml
      service: market_prod_tunnel-service
    networks:
      - market_prod_tunnel-network
    depends_on:
      - market_prod_gateway-service

volumes:
  market_prod_api-db-data:
  market_prod_api-cache-data:

networks:
  market_prod_tunnel-network:
  market_prod_gateway-network:
  market_prod_api-network:
