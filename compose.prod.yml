name: prod_pcmarket
services:
  # ----------------------------------- API -----------------------------------
  prod-api-db-service:
    extends:
      file: ./api/compose.prod.yml
      service: prod-api-db-service
    networks:
      - prod-api-network

  prod-api-cache-service:
    extends:
      file: ./api/compose.prod.yml
      service: prod-api-cache-service
    networks:
      - prod-api-network

  prod-api-service:
    extends:
      file: ./api/compose.prod.yml
      service: prod-api-service
    depends_on:
      prod-api-db-service:
        condition: service_healthy
      prod-api-cache-service:
        condition: service_started
    networks:
      - prod-gateway-network
      - prod-api-network

  # ----------------------------------- WEB -----------------------------------
  prod-web-service:
    extends:
      file: ./web/compose.prod.yml
      service: prod-web-service
    networks:
      - prod-gateway-network

  # ----------------------------------- GATEWAY -----------------------------------
  prod-gateway-service:
    extends:
      file: ./gateway/compose.prod.yml
      service: prod-gateway-service
    networks:
      - prod-tunnel-network
      - prod-gateway-network
    depends_on:
      - prod-api-service
      - prod-web-service

  # ----------------------------------- TUNNEL -----------------------------------
  prod-tunnel-service:
    extends:
      file: ./tunnel/compose.prod.yml
      service: prod-tunnel-service
    networks:
      - prod-tunnel-network
    depends_on:
      - prod-gateway-service

volumes:
  prod-api-db-data:
  prod-api-cache-data:

networks:
  prod-tunnel-network:
  prod-gateway-network:
  prod-api-network:
