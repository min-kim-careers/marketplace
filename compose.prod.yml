name: prod_market
services:
  # ----------------------------------- API -----------------------------------
  prod_api-db-service:
    extends:
      file: ./api/compose.prod.yml
      service: prod_api-db-service
    networks:
      - prod_api-network

  prod_api-cache-service:
    extends:
      file: ./api/compose.prod.yml
      service: prod_api-cache-service
    networks:
      - prod_api-network

  prod_api-service:
    extends:
      file: ./api/compose.prod.yml
      service: prod_api-service
    depends_on:
      prod_api-db-service:
        condition: service_healthy
      prod_api-cache-service:
        condition: service_started
    networks:
      - prod_gateway-network
      - prod_api-network

  # ----------------------------------- WEB -----------------------------------
  prod_web-service:
    extends:
      file: ./web/compose.prod.yml
      service: prod_web-service
    networks:
      - prod_gateway-network

  # ----------------------------------- GATEWAY -----------------------------------
  prod_gateway-service:
    extends:
      file: ./gateway/compose.prod.yml
      service: prod_gateway-service
    networks:
      - prod_tunnel-network
      - prod_gateway-network
    depends_on:
      - prod_api-service
      - prod_web-service

  # ----------------------------------- TUNNEL -----------------------------------
  prod_tunnel-service:
    extends:
      file: ./tunnel/compose.prod.yml
      service: prod_tunnel-service
    networks:
      - prod_tunnel-network
    depends_on:
      - prod_gateway-service

volumes:
  prod_api-db-data:
  prod_api-cache-data:

networks:
  prod_tunnel-network:
  prod_gateway-network:
  prod_api-network:
