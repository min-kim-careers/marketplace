name: prod_pcmarket
services:
  prod-api-db-service:
    container_name: prod-api-db-container
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=apidbuser
      - POSTGRES_PASSWORD=REDACTED
      - POSTGRES_DB=apidb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    command: ["postgres", "-c", "log_checkpoints=off"]
    volumes:
      - prod-api-db-data:/var/lib/postgresql

  prod-api-cache-service:
    container_name: prod-api-cache-container
    restart: always
    image: redis:latest
    environment:
      - REDIS_HOST=prod-api-cache-service
      - REDIS_PORT=6379
      - REDIS_PASSWORD=REDACTED
    command:
      [
        "/bin/sh",
        "-c",
        "redis-server --save 20 1 --loglevel warning --requirepass $$REDIS_PASSWORD",
      ]
    volumes:
      - prod-api-cache-data:/data

  prod-api-service:
    container_name: prod-api-container
    image: prod-api-service
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        - LOCAL_IMAGE_PATH=./images/prod-images
    environment:
      - DB_HOST=prod-api-db-service
      - CACHE_HOST=prod-api-cache-service
    env_file:
      - .env.cloudflare
      - .env.firebase
      - .env.shared
    volumes:
      - ./app:/code/app
      - ./images/prod-images:/code/images

volumes:
  prod-api-db-data:
  prod-api-cache-data:
