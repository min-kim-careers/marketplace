name: marketplace
services:
  dev-gateway-service:
    container_name: dev-gateway-container
    image: nginx:latest
    ports:
      - 8080:8080
    environment:
      - GATEWAY_PORT=8080
      - WEB_SERVICE=dev-web-service:3000
      - API_SERVICE=dev-api-service:8000
      - FIREBASE_APP=market-by-kibon
      - DOMAIN=localhost:8080
      - IMAGE_BASE=/images
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../api/dev-images:/app/images:ro
