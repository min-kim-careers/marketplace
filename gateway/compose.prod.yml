name: prod_pcmarket
services:
  prod-gateway-service:
    container_name: prod-gateway-container
    image: nginx:latest
    ports:
      - 80:80
    environment:
      - HOST=pcmarket.app
      - PORT=80
      - WEB_SERVICE=prod-web-service:3000
      - API_SERVICE=prod-api-service:8000
      - FIREBASE_APP=market-by-kibon
      - IMAGE_BASE=/images
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../api/images/prod-images:/app/images:ro
