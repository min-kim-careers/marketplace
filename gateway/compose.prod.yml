name: market_prod
services:
  market_prod_gateway-service:
    container_name: market_prod_gateway-container
    image: nginx:latest
    ports:
      - 80:80
    env_file:
      - .env.shared
    environment:
      - HOST=pcmarket.app
      - PORT=80
      - WEB_SERVICE=market_prod_web-service:3000
      - API_SERVICE=market_prod_api-service:8000
      - FIREBASE_APP=market-by-kibon
      - IMAGE_BASE=/images
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../api/images/prod:/app/images:ro
