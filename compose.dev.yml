name: market_dev
services:
  # ----------------------------------- API -----------------------------------
  market_dev_api-db-service:
    extends:
      file: ./api/compose.dev.yml
      service: market_dev_api-db-service
    networks:
      - market_dev_api-network

  market_dev_api-cache-service:
    extends:
      file: ./api/compose.dev.yml
      service: market_dev_api-cache-service
    networks:
      - market_dev_api-network

  market_dev_api-service:
    extends:
      file: ./api/compose.dev.yml
      service: market_dev_api-service
    depends_on:
      market_dev_api-db-service:
        condition: service_healthy
      market_dev_api-cache-service:
        condition: service_started
    networks:
      - market_dev_gateway-network
      - market_dev_api-network

  # ----------------------------------- WEB -----------------------------------
  market_dev_web-service:
    extends:
      file: ./web/compose.dev.yml
      service: market_dev_web-service
    networks:
      - market_dev_gateway-network

  # ----------------------------------- GATEWAY -----------------------------------
  market_dev_gateway-service:
    extends:
      file: ./gateway/compose.dev.yml
      service: market_dev_gateway-service
    networks:
      - market_dev_gateway-network
    depends_on:
      - market_dev_api-service
      - market_dev_web-service

volumes:
  market_dev_api-db-data:
  market_dev_api-cache-data:
  market_dev_node_modules:
  market_dev_venv:
  market_dev_pip:

networks:
  market_dev_gateway-network:
  market_dev_api-network:
