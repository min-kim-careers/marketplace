name: dev_pcmarket
services:
  dev-api-db-service:
    container_name: dev-api-db-container
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=apidbuser
      - POSTGRES_PASSWORD=REDACTED
      - POSTGRES_DB=apidb
    volumes:
      - dev-api-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    command: ["postgres", "-c", "log_checkpoints=off"]

  dev-api-cache-service:
    container_name: dev-api-cache-container
    restart: always
    image: redis:latest
    environment:
      - REDIS_HOST=dev-api-cache-service
      - REDIS_PORT=6379
      - REDIS_PASSWORD=REDACTED
    command:
      [
        "/bin/sh",
        "-c",
        "redis-server --save 20 1 --loglevel warning --requirepass $$REDIS_PASSWORD",
      ]
    volumes:
      - dev-api-cache-data:/data

  dev-api-service:
    container_name: dev-api-container
    image: dev-api-service
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        - LOCAL_IMAGE_PATH=./images/dev-images
    environment:
      - DB_HOST=dev-api-db-service
      - DB_PORT=5432
      - DB_USER=apidbuser
      - DB_PASSWORD=REDACTED
      - DB_NAME=apidb

      - CACHE_HOST=dev-api-cache-service
      - CACHE_PORT=6379
      - CACHE_PASSWORD=REDACTED
      - CACHE_DB=0

      - SERVICE_KEY=GIUv6nI8S76oIdVPE3sSe3YvLkF7O6XwqeQp4MOvGUE=
      - SERVICE_KEY_HEADER=x-api-key

      - SESSION_HEADER=__session

      - FRONTEND_IMAGE_BASE=/images
      - CONTAINER_IMAGE_DIR=/code/images

    env_file:
      - .env.firebase
    volumes:
      - ./app:/code/app
      - ./images/dev-images:/code/images
      - dev-venv:/code/.venv
      - dev-pip:/root/.cache/pip

volumes:
  dev-api-db-data:
  dev-api-cache-data:
  dev-venv:
  dev-pip:
