name: dev_pcmarket
services:
  dev-web-service:
    container_name: dev-web-container
    image: dev-web-service
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.shared
    environment:
      - API_URL=http://dev-api-service:8000
      - GATEWAY_URL=http://dev-gateway-service:8080
      - NEXT_PUBLIC_CHAT_URL=ws://192.168.8.103:8080/chat/ws
      - NEXT_PUBLIC_CONTACT=contact@dummy.email
      - NEXT_PUBLIC_APP_URL=http://192.168.8.103:8080
      - NEXT_PUBLIC_SITE_KEY=REDACTED

    volumes:
      - .:/app
      - dev-node_modules:/app/node_modules

volumes:
  dev-node_modules:
