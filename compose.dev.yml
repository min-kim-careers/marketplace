name: market_dev
services:
  market_dev_api-db-service:
    container_name: market_dev_api-db-container
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=apidbuser
      - POSTGRES_PASSWORD=REDACTED
      - POSTGRES_DB=apidb
    volumes:
      - market_dev_api-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    command: ["postgres", "-c", "log_checkpoints=off"]

  market_dev_api-cache-service:
    container_name: market_dev_api-cache-container
    restart: always
    image: redis:latest
    environment:
      - REDIS_HOST=market_dev_api-cache-service
      - REDIS_PORT=6379
      - REDIS_PASSWORD=REDACTED
    command:
      [
        "/bin/sh",
        "-c",
        "redis-server --save 20 1 --loglevel warning --requirepass $$REDIS_PASSWORD",
      ]
    volumes:
      - market_dev_api-cache-data:/data

  market_dev_api-service:
    container_name: market_dev_api-container
    image: market_dev_market_api-image
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        - LOCAL_IMAGE_PATH=./images/dev
    environment:
      - DB_HOST=market_dev_api-db-service
      - CACHE_HOST=market_dev_api-cache-service
    env_file:
      - .env.cloudflare
      - .env.firebase
      - .env.shared
    volumes:
      - ./app:/code/app
      - ./images/dev:/code/images
      - market_dev_venv:/code/.venv
      - market_dev_pip:/root/.cache/pip

volumes:
  market_dev_api-db-data:
  market_dev_api-cache-data:
  market_dev_venv:
  market_dev_pip:
