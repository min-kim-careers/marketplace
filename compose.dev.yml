name: market_dev
services:
  market_dev_web-service:
    container_name: market_dev_web-container
    image: market_dev_market_web-image
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.shared
    environment:
      - API_URL=http://market_dev_api-service:8000
      - GATEWAY_URL=http://market_dev_gateway-service:8080
      - NEXT_PUBLIC_CHAT_URL=ws://192.168.8.103:8080/chat/ws
      - NEXT_PUBLIC_CONTACT=contact@dummy.email
      - NEXT_PUBLIC_APP_URL=http://192.168.8.103:8080
      - NEXT_PUBLIC_SITE_KEY=REDACTED

    volumes:
      - .:/app
      - market_dev_node_modules:/app/node_modules

volumes:
  market_dev_node_modules:
