name: market_dev
services:
  # ----------------------------------- API -----------------------------------
  market_dev_api-db-service:
    container_name: market_dev_api-db-container
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=apidbuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=apidb
    volumes:
      - api-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    command: ["postgres", "-c", "log_checkpoints=off"]
    networks:
      - api-network

  market_dev_api-cache-service:
    container_name: market_dev_api-cache-container
    restart: always
    image: redis:latest
    environment:
      - REDIS_HOST=market_dev_api-cache-service
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      [
        "/bin/sh",
        "-c",
        "redis-server --save 20 1 --loglevel warning --requirepass $$REDIS_PASSWORD",
      ]
    volumes:
      - api-cache-data:/data
    networks:
      - api-network
      - gateway-network

  market_dev_api-service:
    container_name: market_dev_api-container
    image: market_dev_market_api-image
    restart: always
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
      args:
        - LOCAL_IMAGE_PATH=./images/dev
    environment:
      - DB_HOST=market_dev_api-db-service
      - CACHE_HOST=market_dev_api-cache-service
    env_file:
      - ./api/.env.cloudflare
      - ./api/.env.firebase
      - ./api/.env.shared
    volumes:
      - ./api/app:/code/app
      - ./api/images/dev:/code/images
      - venv:/code/.venv
      - pip:/root/.cache/pip
    networks:
      - gateway-network

  # ----------------------------------- WEB -----------------------------------
  market_dev_web-service:
    container_name: market_dev_web-container
    image: market_dev_market_web-image
    restart: always
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./web/.env.shared
    environment:
      - API_URL=http://market_dev_api-service:8000
      - GATEWAY_URL=http://market_dev_gateway-service:8080
      - NEXT_PUBLIC_CHAT_URL=ws://192.168.8.103:8080/chat/ws
      - NEXT_PUBLIC_CONTACT=contact@dummy.email
      - NEXT_PUBLIC_APP_URL=http://192.168.8.103:8080
      - NEXT_PUBLIC_SITE_KEY=${NEXT_PUBLIC_SITE_KEY}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
    volumes:
      - ./web:/app
      - node_modules:/app/node_modules
    networks:
      - gateway-network

  # ----------------------------------- GATEWAY -----------------------------------
  market_dev_gateway-service:
    container_name: market_dev_gateway-container
    image: nginx:latest
    ports:
      - 8080:8080
    env_file:
      - ./gateway/.env.shared
    environment:
      - HOST=192.168.8.103
      - PORT=8080
      - WEB_SERVICE=market_dev_web-service:3000
      - API_SERVICE=market_dev_api-service:8000
      - FIREBASE_APP=market-by-kibon
      - IMAGE_BASE=/images
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./api/images/dev:/app/images:ro
    networks:
      - gateway-network

volumes:
  api-db-data:
  api-cache-data:
  node_modules:
  venv:
  pip:

networks:
  api-network:
  gateway-network:
