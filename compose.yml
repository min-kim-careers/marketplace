services:
  # ----------------------------------- AUTH -----------------------------------
  auth-db-service:
    extends:
      file: ./auth/compose.yml
      service: auth-db-service
    networks:
      - auth-network

  auth-service:
    extends:
      file: ./auth/compose.yml
      service: auth-service
    networks:
      - auth-network
    depends_on:
      - auth-db-service

  # ----------------------------------- API -----------------------------------
  api-db-service:
    extends:
      file: ./api/compose.yml
      service: api-db-service
    networks:
      - api-network

  api-service:
    extends:
      file: ./api/compose.yml
      service: api-service
    depends_on:
      api-db-service:
        condition: service_healthy
    networks:
      - api-network

  # ----------------------------------- GATEWAY -----------------------------------
  gateway-service:
    extends:
      file: ./gateway/compose.yml
      service: gateway-service
    ports:
      - 3001:3001
    networks:
      - gateway-network
      - api-network
      - auth-network

  # ----------------------------------- WEB -----------------------------------
  web-service:
    extends:
      file: ./web/compose.yml
      service: web-service
    ports:
      - 3000:3000
    networks:
      - gateway-network

volumes:
  auth-db-data:
  api-db-data:

networks:
  api-network:
  auth-network:
  gateway-network:
