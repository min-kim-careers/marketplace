services:
  api-db-service:
    container_name: api-db-container
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=apidbuser
      - POSTGRES_PASSWORD=REDACTED
      - POSTGRES_DB=apidb
    volumes:
      - api-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    command: ["postgres", "-c", "log_checkpoints=off"]

  api-cache-service:
    container_name: api-cache-container
    restart: always
    image: redis:latest
    environment:
      - REDIS_HOST=api-cache-service
      - REDIS_PORT=6379
      - REDIS_PASSWORD=REDACTED
    command:
      [
        "/bin/sh",
        "-c",
        "redis-server --save 20 1 --loglevel warning --requirepass $$REDIS_PASSWORD",
      ]
    volumes:
      - api-cache-data:/data

  api-service:
    depends_on:
      api-db-service:
        condition: service_healthy
      api-cache-service:
        condition: service_started
    container_name: api-container
    restart: always
    build: .
    environment:
      - PYTHONUNBUFFERED=1

      - DB_HOST=api-db-service
      - DB_PORT=5432
      - DB_USER=apidbuser
      - DB_PASSWORD=REDACTED
      - DB_NAME=apidb

      - CACHE_HOST=api-cache-service
      - CACHE_PORT=6379
      - CACHE_PASSWORD=REDACTED
      - CACHE_DB=0

      - SERVICE_KEY=GIUv6nI8S76oIdVPE3sSe3YvLkF7O6XwqeQp4MOvGUE=
      - SERVICE_KEY_HEADER=x-api-key

      - SESSION_HEADER=__session

      - SYNAPSE_URL=http://synapse-service:8008
      - SYNAPSE_SHARED_SECRET=REDACTED
      - SYNAPSE_ADMIN_USER=admin
    env_file:
      - .env
      - .env.firebase
    volumes:
      - ./app:/code/app
      - ./images:/code/images

volumes:
  api-db-data:
  api-cache-data:
