services:
  # ----------------------------------- AUTH -----------------------------------
  auth-db-service:
    extends:
      file: ./auth/compose.yml
      service: auth-db-service
    networks:
      - auth-network

  auth-service:
    extends:
      file: ./auth/compose.yml
      service: auth-service
    networks:
      - auth-network
    depends_on:
      - auth-db-service

  # ----------------------------------- API -----------------------------------
  api-db-service:
    extends:
      file: ./api/compose.yml
      service: api-db-service
    networks:
      - api-network

  api-service:
    extends:
      file: ./api/compose.yml
      service: api-service
    depends_on:
      api-db-service:
        condition: service_healthy
    networks:
      - api-network

  # ----------------------------------- CHAT -----------------------------------
  chat-cache-service:
    extends:
      file: ./chat/compose.yml
      service: chat-cache-service
    networks:
      - chat-network

  chat-db-service:
    extends:
      file: ./chat/compose.yml
      service: chat-db-service
    networks:
      - chat-network

  chat-service:
    extends:
      file: ./chat/compose.yml
      service: chat-server-service
    ports:
      - 8080:8080
      - 8082:8082
    depends_on:
      - chat-db-service
      - chat-cache-service
    networks:
      - chat-network
      - auth-network

  # ----------------------------------- GATEWAY -----------------------------------
  gateway-service:
    extends:
      file: ./frontend/gateway/compose.yml
      service: gateway-service
    ports:
      - 3001:3001
    networks:
      - gateway-network
      - api-network
      - auth-network
      - chat-network

  # ----------------------------------- WEB -----------------------------------
  web-service:
    extends:
      file: ./frontend/web/compose.yml
      service: web-service
    ports:
      - 3000:3000
    networks:
      - gateway-network
      - api-network
      - auth-network
      - chat-network

volumes:
  auth-db-data:
  api-db-data:
  chat-db-data:
  chat-cache-data:

networks:
  api-network:
  auth-network:
  chat-network:
  gateway-network:
