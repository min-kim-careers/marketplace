services:
  web-service:
    extends:
      file: ./web/compose.yml
      service: web-service
    ports:
      - 3000:3000
    networks:
      - api-network
      - auth-network

  api-db-service:
    extends:
      file: ./api/compose.yml
      service: api-db-service
    networks:
      - api-network

  api-service:
    extends:
      file: ./api/compose.yml
      service: api-service
    depends_on:
      api-db-service:
        condition: service_healthy
    ports:
      - 8080:8080
    networks:
      - api-network

  auth-db-service:
    extends:
      file: ./auth/compose.yml
      service: auth-db-service
    networks:
      - auth-network

  auth-service:
    extends:
      file: ./auth/compose.yml
      service: auth-service
    depends_on:
      auth-db-service:
        condition: service_healthy
    ports:
      - 8000:8000
    networks:
      - auth-network

volumes:
  api-db-data:
  auth-db-data:

networks:
  api-network:
  auth-network:
