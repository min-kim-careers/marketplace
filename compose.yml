services:
  # ----------------------------------- API -----------------------------------
  api-db-service:
    extends:
      file: ./api/compose.yml
      service: api-db-service
    networks:
      - api-network

  api-service:
    extends:
      file: ./api/compose.yml
      service: api-service
    depends_on:
      api-db-service:
        condition: service_healthy
    ports:
      - 8000:8000
    networks:
      - api-network
      - web-network

  # ----------------------------------- WEB -----------------------------------
  web-service:
    extends:
      file: ./web/compose.yml
      service: web-service
    ports:
      - 3000:3000
    networks:
      - web-network

volumes:
  api-db-data:

networks:
  api-network:
  web-network:
