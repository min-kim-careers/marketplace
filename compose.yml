services:
  api-db-service:
    container_name: api-db-container
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=apidbuser
      - POSTGRES_PASSWORD=REDACTED
      - POSTGRES_DB=apidb
    volumes:
      - api-db-data:/var/lib/postgresql/data

  # api-cache-service:
  #   container_name: api-cache-container
  #   restart: always
  #   image: redis:latest
  #   environment:
  #     - REDIS_HOST=api-cache-service
  #     - REDIS_PORT=6379
  #     - REDIS_PASSWORD=redispassword
  #   command: [ '/bin/sh', '-c', 'redis-server --save 20 1 --loglevel warning --requirepass $$REDIS_PASSWORD' ]
  #   volumes:
  #     - api-cache-data:/data

  api-service:
    depends_on:
      - api-db-service
      # - api-cache-service
    container_name: api-container
    restart: always
    build: .
    ports:
      - 8000:8000
    environment:
      - PYTHONUNBUFFERED=1

      # Postgres
      - DB_HOST=api-db-service
      - DB_PORT=5432
      - DB_USER=apidbuser
      - DB_PASSWORD=REDACTED
      - DB_NAME=apidb

      # Redis
      # - CACHE_HOST=api-cache-service
      # - CACHE_PORT=6379
      # - CACHE_PASSWORD=redispassword
      # - CACHE_DB=0

      - SERVICE_KEY=GIUv6nI8S76oIdVPE3sSe3YvLkF7O6XwqeQp4MOvGUE=
      - SERVICE_KEY_HEADER=x-api-key
    env_file:
      - .env
    volumes:
      - ./app:/code/app

volumes:
  api-db-data:
  # api-cache-data:


