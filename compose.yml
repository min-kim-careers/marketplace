services:
  web-service:
    container_name: web-container
    restart: always
    build: .
    environment:
      - API_URL=http://api-service:8000
      - API_KEY=REDACTED
      - API_KEY_HEADER=REDACTED
      
      - SESSION_HEADER=__session
    env_file:
      - .env
    volumes:
      - .:/app
