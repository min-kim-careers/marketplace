services:
  nginx-service:
    container_name: nginx-container
    image: nginx:latest
    ports:
      - 80:80
    environment:
      - DOMAIN=localhost
      - WEB_SERVICE=web-service:3000
      - API_SERVICE=api-service:8000
      - SYNAPSE_SERVICE=synapse-service:8008
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./api/images:/app/images:ro
    depends_on:
      - synapse-service
      - api-service
      - web-service

  # ----------------------------------- CHAT -----------------------------------
  synapse-db-service:
    extends:
      file: ./chat/compose.yml
      service: synapse-db-service

  synapse-service:
    extends:
      file: ./chat/compose.yml
      service: synapse-service
    ports:
      - 8008:8008

  # ----------------------------------- API -----------------------------------
  api-db-service:
    extends:
      file: ./api/compose.yml
      service: api-db-service

  api-service:
    extends:
      file: ./api/compose.yml
      service: api-service
    depends_on:
      api-db-service:
        condition: service_healthy
    ports:
      - 8000:8000

  # ----------------------------------- WEB -----------------------------------
  web-service:
    extends:
      file: ./web/compose.yml
      service: web-service
    ports:
      - 3000:3000

volumes:
  api-db-data:
  synapse-db-data:
