services:
  marketplace-db-service:
    container_name: 'marketplace-db-container'
    restart: 'always'
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_USER=marketplaceuser'
      - 'POSTGRES_PASSWORD=marketplacepassword'
      - 'POSTGRES_DB=marketplacedb'

    ports:
      - '5433:5432'
    volumes:
      - 'marketplace-db-data:/var/lib/postgresql/data'

  marketplace-cache-service:
    container_name: 'marketplace-cache-container'
    restart: 'always'
    image: 'redis:latest'
    environment:
      - 'REDIS_HOST=marketplace-cache-service'
      - 'REDIS_PORT=6379'
      - 'REDIS_PASSWORD=redispassword'
    ports:
      - '6380:6379'
    command: [ '/bin/sh', '-c', 'redis-server --save 20 1 --loglevel warning --requirepass $$REDIS_PASSWORD' ]
    volumes:
      - 'marketplace-cache-data:/data'

  marketplace-server-service:
    depends_on:
      - 'marketplace-db-service'
      - 'marketplace-cache-service'
    container_name: 'marketplace-server-container'
    restart: 'always'
    build: './marketplace-server'
    ports:
      - '8001:80'
    env_file:
      - './marketplace-server/.env'
    volumes:
      - './marketplace-server/app:/app'

  marketplace-app-service:
    container_name: 'marketplace-app-container'
    restart: 'always'
    build: ./marketplace-app
    ports:
      - '3000:3000'
    env_file:
      - './marketplace-app/.env'
    volumes:
      - './marketplace-app:/app'


  chat-db-service:
    extends:
      file: './chat/docker-compose.yml'
      service: 'chat-db-service'

  chat-cache-service:
    extends:
      file: './chat/docker-compose.yml'
      service: 'chat-cache-service'

  chat-server-service:
    extends:
      file: './chat/docker-compose.yml'
      service: 'chat-server-service'

volumes:
  chat-db-data:
  chat-cache-data:
